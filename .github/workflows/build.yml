
name: Build SkyCases Ultimate

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz projekt
        uses: actions/checkout@v4

      - name: Zainstaluj Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Zainstaluj Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Zbuduj plugin
        run: gradle shadowJar --stacktrace

      - name: Udostepnij plik JAR
        uses: actions/upload-artifact@v4
        with:
          name: SkyCasesUltimate-JAR
          path: build/libs/*.jar
          if-no-files-found: error
